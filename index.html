<!doctype html>
<html lang="de">
<head>
    <title> Lernprogramm v0.1 </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Adaptivität vom Screen in der Abhängigkeit vom Gerät-->
    <link rel="stylesheet" href="style.css"> <!--css einschalten-->
    <link rel="manifest" href="manifest.json"> <!--manifest für PWA-->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/gh/0xfe/vexflow@4.1.0/build/cjs/vexflow.js"></script>
    <script src="app.js" type="module" defer></script> <!--einschalten JS Logik-->

    <!--Katex-->
    <link rel = "stylesheet" href="katex/katex.css">
    <script src="katex/katex.js" defer></script>
    <script src="katex/contrib/auto-render.js" defer></script>
</head>

<body>
    <header>
        <img src="images/logo--image.png" alt="Logo" class="logo">
        <p>Lernprogramm</p>
    </header>

    <nav>
        <ul id="mvp">
            <li><a href="mvp-demo/mvp.html" title="Zur MVP (Blitzaufgaben)">MVP</a></li>
        </ul>
    </nav>
    <nav>
        <ul id="mathl">
            <li><a href="mathe-demo.html" title="Zu den Matheaufgaben"> Mathe lernen</a></li>
        </ul>
    </nav>

</body>


<main>
    <section id="category-selection">
        <h2>Kategorie wählen</h2>
        <button data-category="mathe">Mathe</button>
        <button data-category="web">Web</button>
        <button data-category="noten">Noten</button>
        <button id="open-piano">Piano</button> 
    </section>

    <section id="question-area" hidden>
        <div id="question-text"></div>
        <div id="answer"></div>
        <div id="vex-container" style="margin-top: 1em;"></div>
        <progress id="progress-bar" value="0" max="100"></progress>
        <button id="exit-quiz">Quiz beenden</button>
    </section>

    <section id="result-area" hidden>
        <h2>Ergebnis</h2>
        <div id="stats"></div>
    </section>

    <section id="piano-section" hidden>
        <h2>Piano</h2>
        <button id="toggle-accidentals">♯ / ♭</button>
        <div id="piano">
        <div class="white-key" data-note="C">C</div>
        <div class="white-key" data-note="D">D</div>
        <div class="white-key" data-note="E">E</div>
        <div class="white-key" data-note="F">F</div>
        <div class="white-key" data-note="G">G</div>
        <div class="white-key" data-note="A">A</div>
        <div class="white-key" data-note="B">B</div>

        <div class="black-key" data-note="Csharp" data-alt="Db" style="left: 45px;">C♯</div>
        <div class="black-key" data-note="Dsharp" data-alt="Eb" style="left: 105px;">D♯</div>
        <div class="black-key" data-note="Fsharp" data-alt="Gb" style="left: 225px;">F♯</div>
        <div class="black-key" data-note="Gsharp" data-alt="Ab" style="left: 285px;">G♯</div>
        <div class="black-key" data-note="Asharp" data-alt="Bb" style="left: 345px;">A♯</div>
        </div>
        <button id="exit-piano">Zurück zum Hauptmenü</button>
    </section>
    
</main>



<footer>
    <p>&copy; 2025 Radmir Mullagaliev, s85138 - Lernprogramm - Beleg für IT1</p>
</footer>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('scripts/sw.js');
    }
    
</script>
