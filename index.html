<!doctype html>
<html lang="de">
<head>
    <title> Lernprogramm v0.1 </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- адаптивность экрана в зависимости от устройства-->
    <link rel="stylesheet" href="style.css"> <!--подключение css (нужно для внешнего вида)-->
    <link rel="manifest" href="manifest.json"> <!--подключение манифеста (для PWA)-->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="app.js" type="module" defer></script> <!--подключение JS-логики, defer нужен, чтобы скрипт выполнялся после загрузки HTML-->
</head>

<body>
    <header>
        <img src="images/logo--image.png" alt="Logo" class="logo">
        <p>Lernprogramm</p>
    </header>

    <nav>
        <ul id="mvp">
            <li><a href="mvp-demo/mvp.html" title="Zur MVP (Blitzaufgaben)">MVP</a></li>
        </ul>
    </nav>
    <nav>
        <ul id="mathl">
            <li><a href="mathe-demo.html" title="Zu den Matheaufgaben"> Mathe lernen</a></li>
        </ul>
    </nav>

</body>


<main>
    <section id="category-selection">
        <h2>Kategorie wählen</h2>
        <button data-category="mathe">Mathe</button>
        <button data-category="web">Web</button>
        <button data-category="noten">Noten</button>
    </section>

    <section id="question-area" hidden>
        <div id="question-text"></div>
        <div id="answer"></div>
        <progress id="progress-bar" value="0" max="100"></progress>
    </section>

    <section id="result-area" hidden>
        <h2>Ergebnis</h2>
        <div id="stats"></div>
    </section>

    
</main>

<footer>
    <p>&copy; 2025 Radmir Mullagaliev, s85138 - Lernprogramm - Beleg für IT1</p>
</footer>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('scripts/sw.js');
    }
    </script>
